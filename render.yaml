# Render Blueprint - FastAPI backend (Swagger UI at /docs)
services:
  - type: web
    name: callwatch-api
    runtime: python
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SEC_USER_AGENT          # "CallWatch Name contact@email" (SEC fair-access policy)
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: DATABASE_URL            # Supabase Postgres "Session pooler" URI (IPv4) - keeps data across restarts
        sync: false
      - key: FEATURED_TICKERS        # public front page, analysed by the server and refreshed daily
        value: AAPL,MSFT,NVDA,GOOGL,TSLA,SPCX,C,LLY
      - key: ANON_DAILY_ANALYSIS_LIMIT   # new (non-featured) tickers per browser/IP per day
        value: "3"
      - key: QA_DAILY_LIMIT          # AI questions per browser per day
        value: "20"
      - key: OWNER_KEY               # operator key: unlocks Toss sync and lifts limits
        generateValue: true
      - key: TOSS_CLIENT_ID          # Toss Securities Open API, operator's own account (read-only)
        sync: false
      - key: TOSS_CLIENT_SECRET
        sync: false
      - key: CORS_ORIGINS            # your Vercel URL, e.g. https://callwatch.vercel.app
        sync: false
      - key: DATA_DIR
        value: /tmp/callwatch
      # Optional sign-in (Supabase Auth). Leave unset for open access without accounts.
      # - SUPABASE_URL, SUPABASE_ANON_KEY, OWNER_EMAILS, DAILY_ANALYSIS_LIMIT, SUPABASE_SERVICE_ROLE_KEY
